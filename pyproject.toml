[project]
name = "agent6-assignment"
version = "0.1.0"
description = "Session 6 four-layer agent using LLM Gateway V3 and MCP stdio tools"
requires-python = ">=3.11"
dependencies = [
  "crawl4ai>=0.6.0",
  "ddgs>=9.0.0",
  "faiss-cpu>=1.8.0",
  "fastapi>=0.110",
  "httpx>=0.27",
  "jsonschema>=4.21",
  "mcp>=1.13.0",
  "networkx>=3.0",
  "numpy>=1.26",
  "pydantic>=2.6",
  "pyyaml>=6.0",
  "python-dotenv>=1.0",
  "tavily-python>=0.7.0",
  "uvicorn[standard]>=0.27",
]

[tool.pytest.ini_options]
pythonpath = ["."]
